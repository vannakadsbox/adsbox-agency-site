# Makes sample videos (with the Khmer voice) on the video-sample branch and commits them to videos/ on that branch.
# Push a change under tools/ to the branch to run it. Not used by the live site.
name: Video sample

on:
  push:
    branches: [video-sample]
    paths: ["tools/video.js", "tools/video_story.js", "videos/story-*.json", "tools/video_script.py", "tools/tts.py", ".github/workflows/video-sample.yml", "videos/requests.txt"]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q fonts-noto-color-emoji ffmpeg
          npm install --no-save --no-package-lock playwright@1.48.2
          npx playwright install --with-deps chromium
          pip install pyyaml pillow edge-tts
      - name: Make videos
        run: |
          mkdir -p videos
          while read -r slug voice; do
            [ -n "$slug" ] || continue
            node tools/video.js "content/articles/$slug.md" "videos/$slug-${voice:-km-KH-SreymomNeural}.mp4" --voice "${voice:-km-KH-SreymomNeural}"
          done < videos/requests.txt
          for story in videos/story-*.json; do
            [ -e "$story" ] && node tools/video_story.js "$story" "${story%.json}.mp4"
          done
      - name: Commit the videos
        run: |
          git add videos/*.mp4
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "ADS BOX video maker"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sample videos"
          git push origin HEAD:video-sample
      - name: Send the story videos to Telegram
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          for v in videos/story-*.mp4; do
            [ -e "$v" ] || continue
            # Tell Telegram the real size (tall 9:16) and give it a cover, so it shows full size instead of cropped.
            ffmpeg -y -loglevel error -ss 1 -i "$v" -frames:v 1 -vf scale=180:320 /tmp/thumb.jpg
            dur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$v" | cut -d. -f1)
            curl -sS -f "https://api.telegram.org/bot$TOKEN/sendVideo" -F chat_id="$CHAT" -F video=@"$v" \
              -F width=1080 -F height=1920 -F duration="$dur" -F thumbnail=attach://thumb -F thumb=@/tmp/thumb.jpg \
              -F supports_streaming=true -F caption="🎬 វីដេអូ ADS BOX (រូបថត + សំឡេងខ្មែរ + អក្សររត់) សម្រាប់ Reels / TikTok" > /dev/null
          done
