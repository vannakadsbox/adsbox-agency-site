# Facebook Page publishing, owner-approved: each video's caption message in Telegram has a "Publish" button.
# Since Nov 2026 a tap goes to the Cloudflare Worker (workers/fbhook, deployed by fbhook-deploy.yml), which starts this workflow with action "tap"
# for that one video. There is no schedule any more: GitHub runs only when a video is tapped (or when run by hand).
name: Facebook publish
on:
  workflow_dispatch:
    inputs:
      action:
        description: "tap = publish one tapped video (from the webhook) · check = test the Facebook token · draft / offer / cover = slug below · webhook-info / webhook-delete = Telegram webhook (connect it with the Facebook webhook (Cloudflare) workflow) · poll = manual fallback (only without a webhook)"
        type: choice
        options: [tap, check, draft, offer, cover, webhook-info, webhook-delete, poll]
        default: check
      slug:
        description: "tap / draft / offer / cover: video slug"
        required: false
      message_id:
        description: "tap: Telegram message id of the video caption (filled in by the webhook)"
        required: false
      chat:
        description: "tap: Telegram chat id (filled in by the webhook)"
        required: false
permissions:
  contents: write
# One queue per video: GitHub keeps only one waiting run per group, so a shared group could cancel a second tap
# that arrives while another video is uploading. Taps on the same video still run one after another.
concurrency:
  group: facebook-publish-${{ github.event.inputs.slug || github.run_id }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_VIDEO_CHAT_ID: ${{ secrets.TELEGRAM_VIDEO_CHAT_ID }}
      IN_SLUG: ${{ github.event.inputs.slug }}
      IN_MSG: ${{ github.event.inputs.message_id }}
      IN_CHAT: ${{ github.event.inputs.chat }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Skip quietly until Facebook is set up
        id: on
        run: '[ -n "$FB_PAGE_ID" ] && [ -n "$FB_PAGE_TOKEN" ] && echo "go=1" >> "$GITHUB_OUTPUT" || echo "Facebook secrets not set"'
      - uses: actions/checkout@v4
        if: steps.on.outputs.go == '1'
      - name: Run
        if: steps.on.outputs.go == '1'
        run: |
          act="${{ github.event.inputs.action }}"
          case "$act" in
            tap)    python3 tools/reel/facebook.py tap "$IN_SLUG" "$IN_MSG" "$IN_CHAT" ;;
            draft)  gh release download video-archive -p "$IN_SLUG.mp4" -O /tmp/v.mp4 --clobber
                    python3 tools/reel/facebook.py publish "$IN_SLUG" /tmp/v.mp4 --draft ;;
            cover|offer) python3 tools/reel/facebook.py "$act" "$IN_SLUG" ;;
            webhook-info)   python3 tools/reel/facebook.py webhook info ;;
            webhook-delete) python3 tools/reel/facebook.py webhook delete ;;
            *)      python3 tools/reel/facebook.py "$act" ;;
          esac
      - name: Save the production log
        if: always() && steps.on.outputs.go == '1'
        run: |
          git config user.name "ADS BOX video bot"; git config user.email "noreply@anthropic.com"
          if ! git diff --quiet -- videos/log.json; then
            git add videos/log.json && git commit -q -m "Video log: Facebook [skip ci]" && (git pull -q --rebase && git push -q || (sleep 5; git pull -q --rebase && git push -q))
          fi
