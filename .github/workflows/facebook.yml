# Facebook Page publishing, owner-approved: each video's caption message in Telegram has a "Publish" button;
# this workflow checks for taps every few minutes and posts that video to the Page as a Reel. Nothing posts without a tap.
name: Facebook publish
on:
  schedule:
    # Each run stays awake ~55 minutes checking for taps every 20 seconds; runs queue one after another.
    - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      action:
        description: "check = test the Facebook token · draft = upload the slug below as an unpublished draft Reel · poll = handle Publish taps now"
        type: choice
        options: [check, draft, offer, cover, poll, loop]
        default: check
      slug:
        description: "draft / offer / cover: video slug"
        required: false
permissions:
  contents: write
concurrency:
  group: facebook-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_VIDEO_CHAT_ID: ${{ secrets.TELEGRAM_VIDEO_CHAT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Skip quietly until Facebook is set up
        id: on
        run: '[ -n "$FB_PAGE_ID" ] && [ -n "$FB_PAGE_TOKEN" ] && echo "go=1" >> "$GITHUB_OUTPUT" || echo "Facebook secrets not set"'
      - uses: actions/checkout@v4
        if: steps.on.outputs.go == '1'
      - name: Run
        if: steps.on.outputs.go == '1'
        run: |
          act="${{ github.event.inputs.action }}"; [ -z "$act" ] && act=loop
          if [ "$act" = draft ]; then
            gh release download video-archive -p "${{ github.event.inputs.slug }}.mp4" -O /tmp/v.mp4 --clobber
            python3 tools/reel/facebook.py publish "${{ github.event.inputs.slug }}" /tmp/v.mp4 --draft
          elif [ "$act" = cover ]; then
            python3 tools/reel/facebook.py cover "${{ github.event.inputs.slug }}"
          elif [ "$act" = offer ]; then
            python3 tools/reel/facebook.py offer "${{ github.event.inputs.slug }}"
          elif [ "$act" = loop ]; then
            python3 tools/reel/facebook.py loop 55
          else
            python3 tools/reel/facebook.py "$act"
          fi
      - name: Save the production log
        if: always() && steps.on.outputs.go == '1'
        run: |
          git config user.name "ADS BOX video bot"; git config user.email "noreply@anthropic.com"
          if ! git diff --quiet -- videos/log.json; then
            git add videos/log.json && git commit -q -m "Video log: Facebook [skip ci]" && (git pull -q --rebase && git push -q || (sleep 5; git pull -q --rebase && git push -q))
          fi
