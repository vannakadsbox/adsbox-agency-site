name: Probe link reading (temporary test)
on:
  push:
    branches: [test/fetch-probe]
    paths: ["probe/probe.py", ".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 probe/probe.py
      - run: |
          git config user.name "probe"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe/result.json; git commit -m "probe result"; git push origin HEAD:test/fetch-probe
