# TEMPORARY (preview branch only, deleted before merging): runs the real content build on GitHub, where Facebook
# and TikTok can be reached, and saves the auto-read names, followers and pictures back to this branch for review.
name: Preview listings build
on:
  push:
    branches: ["preview/sell-accounts"]
    paths: ["content/listings.json", "tools/content.py", "tools/fetch_profiles.py", ".github/workflows/profile-fetch-test.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q pyyaml pillow && python3 tools/content.py
      - name: Save to this branch
        run: |
          git config user.name "preview build"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/listings-cache.json listings.js assets/listings && git commit -m "Preview: auto-read listing details" && git push origin HEAD:preview/sell-accounts || true
