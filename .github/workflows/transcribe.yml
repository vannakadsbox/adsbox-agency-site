# Writes the text and timings of a voice recording (videos/voice/*.mp3) next to it, on the video-sample branch.
name: Transcribe voice

on:
  push:
    branches: [video-sample]
    paths: ["videos/voice/*.mp3", "tools/transcribe.py", ".github/workflows/transcribe.yml"]

permissions:
  contents: write

jobs:
  transcribe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q faster-whisper
      - name: Transcribe
        run: |
          for f in videos/voice/*.mp3; do
            [ -e "${f%.mp3}.json" ] && continue
            python3 tools/transcribe.py "$f" "${f%.mp3}.json"
          done
      - name: Commit
        run: |
          git add videos/voice/*.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "ADS BOX video maker"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Voice transcript"
          git pull --rebase origin video-sample && git push origin HEAD:video-sample
