# Voice provider test: makes labelled voice samples of videos/voice-tests/script.txt and sends them to Telegram.
# Manual only. Does not touch the production voice, videos or articles.
name: Voice test
on:
  workflow_dispatch:
    inputs:
      send:
        description: "Send the samples to Telegram"
        type: boolean
        default: true
      kiri_only:
        description: "Kiri samples only (no Microsoft Piseth)"
        type: boolean
        default: false
      kiri_voices:
        description: "Kiri voices, comma separated (empty = all five male Khmer voices)"
        required: false
      instruction:
        description: "Kiri style instruction (max 100 characters; empty = none)"
        required: false
      label:
        description: "Title for the Telegram sample, e.g. DARA – FINAL COMPARISON TEST"
        required: false
permissions:
  contents: read
jobs:
  samples:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_VIDEO_CHAT_ID: ${{ secrets.TELEGRAM_VIDEO_CHAT_ID }}
      KIRI_API_KEY: ${{ secrets.KIRI_API_KEY }}
      VT_KIRI_ONLY: ${{ github.event.inputs.kiri_only }}
      VT_KIRI_VOICES: ${{ github.event.inputs.kiri_voices }}
      VT_INSTRUCTION: ${{ github.event.inputs.instruction }}
      VT_LABEL: ${{ github.event.inputs.label }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg && pip install -q "edge-tts>=7.0"
      - name: Make samples
        run: python3 tools/reel/voice_test.py make out
      - name: Send to Telegram
        if: github.event.inputs.send == 'true'
        run: python3 tools/reel/voice_test.py send out
      - uses: actions/upload-artifact@v4
        with:
          name: voice-samples
          path: out/*.mp3
