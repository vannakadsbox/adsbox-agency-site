  - name: autopost-settings
    label: បោះពុម្ពស្វ័យប្រវត្តិ · ការកំណត់
    description: បើក/បិទ ការបោះពុម្ពអត្ថបទស្វ័យប្រវត្តិ។ ពេល Save ការកំណត់ចូលជាធរមានភ្លាមៗ។ បើប្តូរម៉ោង សូមប្រាប់ Claude ឲ្យប្តូរ Scheduled task ដែរ។
    type: file
    path: content/autopost/settings.json
    format: json
    fields:
    - name: enabled
      label: បើកការបោះពុម្ពស្វ័យប្រវត្តិ (បិទ = ផ្អាក)
      type: boolean
      default: true
    - name: mode
      label: របៀប
      description: live = បោះពុម្ពលើវេបសាយ។ dry_run = សាកល្បង (សរសេរ និងពិនិត្យ ប៉ុន្តែមិនបង្ហាញលើវេបសាយ)។
      type: select
      options:
        values:
        - live
        - dry_run
    - name: timezone
      label: ម៉ោងតំបន់ (កុំប្តូរ)
      type: string
      readonly: true
    - name: morning
      label: អត្ថបទពេលព្រឹក
      type: object
      fields:
      - name: enabled
        label: បើក
        type: boolean
      - name: time
        label: ម៉ោង (HH:MM ម៉ោងកម្ពុជា)
        type: string
        pattern:
          regex: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          message: ឧ. 07:00
    - name: evening
      label: អត្ថបទពេលល្ងាច
      type: object
      fields:
      - name: enabled
        label: បើក
        type: boolean
      - name: time
        label: ម៉ោង (HH:MM ម៉ោងកម្ពុជា)
        type: string
        pattern:
          regex: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          message: ឧ. 17:00
    - name: early_minutes
      label: អាចចាប់ផ្តើមមុនម៉ោង (នាទី)
      type: number
    - name: late_minutes
      label: បោះពុម្ពយឺតបំផុតក្រោយម៉ោង (នាទី)
      description: ក្រោយពេលនេះ មិនបោះពុម្ពទេ (គ្មានការបោះពុម្ពបង្គ្រប់)។
      type: number
    - name: alert_after_minutes
      label: ផ្ញើ Telegram ប្រាប់ បើគ្មានអត្ថបទក្រោយម៉ោង (នាទី)
      type: number
    - name: max_attempts
      label: ចំនួនដងសាកល្បងឡើងវិញ
      type: number
    - name: min_khmer_chars
      label: ប្រវែងអប្បបរមា (តួអក្សរខ្មែរ)
      type: number
    - name: max_khmer_chars
      label: ប្រវែងអតិបរមា (តួអក្សរខ្មែរ)
      type: number
    operations:
      delete: false
  - name: autopost-history
    label: បោះពុម្ពស្វ័យប្រវត្តិ · ប្រវត្តិ
    description: កំណត់ត្រាម្តងៗ (published = បានបោះពុម្ព, failed = បរាជ័យ, dry_run = សាកល្បង)។ សម្រាប់មើលប៉ុណ្ណោះ សូមកុំកែ។ ចុងក្រោយនៅខាងក្រោម។
    type: file
    path: content/autopost/history.json
    format: json
    fields:
    - name: runs
      label: ការបោះពុម្ព
      type: object
      list:
