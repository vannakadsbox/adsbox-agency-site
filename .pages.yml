# Admin panel settings for Pages CMS (https://app.pagescms.org).
# Staff edit the files in content/; .github/workflows/build.yml then rebuilds the site.
media:
  input: assets/uploads
  output: /assets/uploads
  extensions: [jpg, jpeg, png, webp, gif]

content:
  - name: articles
    label: ចំណេះដឹង (អត្ថបទ)
    description: អត្ថបទក្នុងទំព័រ ចំណេះដឹង។ ចុច "Add an entry" ដើម្បីសរសេរអត្ថបទថ្មី។
    type: collection
    path: content/articles
    format: yaml-frontmatter
    filename:
      template: "{fields.slug}.md"
      field: create
    view:
      fields: [title, tag, date]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: ចំណងជើង
        type: string
        required: true
      - name: slug
        label: តំណភ្ជាប់ (អក្សរឡាតាំង)
        description: "ជាអក្សរអង់គ្លេសតូច និងសញ្ញា - ប៉ុណ្ណោះ ឧ. boost-tips-for-new-page។ វាក្លាយជា adsbox.agency/knowledge/<តំណ>/ ហើយមិនអាចប្តូរបានក្រោយពេលបង្កើត។"
        type: string
        required: true
        pattern:
          regex: "^[a-z0-9]+(-[a-z0-9]+)*$"
          message: ប្រើតែអក្សរឡាតាំងតូច លេខ និងសញ្ញា - (ឧ. sell-more-on-live)
      - name: summary
        label: សេចក្តីសង្ខេប
        description: ១-២ ប្រយោគ។ បង្ហាញលើកាត និងពេលចែករំលែកលើ Facebook។
        type: text
        required: true
      - name: tag
        label: ប្រធានបទ
        type: select
        required: true
        default: Boost Post
        options:
          values: [Boost Post, Boost Live, TikTok, លក់ Live, ថែទាំផេក, រចនា, Messenger, ចំណេះដឹង, លក់អនឡាញ, សេវាអតិថិជន, ថវិកា និងរបាយការណ៍, ADS BOX]
      - name: date
        label: កាលបរិច្ឆេទ
        type: date
        required: true
      - name: emoji
        label: Emoji លើរូបគម្រប
        description: "Emoji ៣ ដកឃ្លាពីគ្នា ឧ. 🎥 🛍️ 💡។ រូបគម្រប និងរូបចែករំលែក Facebook ត្រូវបានបង្កើតដោយស្វ័យប្រវត្តិ។"
        type: string
        default: "📣 💬 📈"
      - name: cover
        label: រូបគម្របផ្ទាល់ខ្លួន (ស្រេចចិត្ត)
        description: ទុកទទេ ដើម្បីប្រើរូបគម្របស្វ័យប្រវត្តិ។ បើដាក់ សូមប្រើរូបទំហំ 1200x630។
        type: image
      - name: draft
        label: ព្រាង / ដកចេញពីវេបសាយ
        description: បើកវា ដើម្បីលាក់អត្ថបទពីវេបសាយ (មិនលុបចោល)។ បិទវិញ ដើម្បីបង្ហាញម្តងទៀត។
        type: boolean
        default: false
      - name: seo_title
        label: SEO ចំណងជើង (ស្រេចចិត្ត)
        description: ចំណងជើងសម្រាប់ Google (ក្រោម 60 តួ)។ ទុកទទេ ដើម្បីប្រើចំណងជើងធម្មតា។
        type: string
      - name: seo_description
        label: SEO ការពិពណ៌នា (ស្រេចចិត្ត)
        description: 70-160 តួ។ ទុកទទេ ដើម្បីប្រើសេចក្តីសង្ខេប។
        type: text
      - name: primary_keyword
        label: ពាក្យគន្លឹះចម្បង
        type: string
      - name: keywords
        label: ពាក្យគន្លឹះ
        type: string
        list: true
      - name: image_alt
        label: ការពិពណ៌នារូបភាព (alt)
        type: string
      - name: category
        label: ប្រភេទមាតិកា (ស្វ័យប្រវត្តិ)
        type: string
      - name: image_prompt
        label: Prompt សម្រាប់រូបភាព (ស្វ័យប្រវត្តិ)
        type: text
      - name: source
        label: ប្រភព (ស្វ័យប្រវត្តិ)
        type: string
      - name: generated_at
        label: ពេលបង្កើត (ស្វ័យប្រវត្តិ)
        type: string
      - name: updated
        label: កាលបរិច្ឆេទកែប្រែចុងក្រោយ (ស្រេចចិត្ត)
        type: date
      - name: body
        label: អត្ថបទ
        type: rich-text
        options:
          format: markdown

  - name: services
    label: សេវាកម្ម
    description: សេវាកម្មទាំងអស់ដែលបង្ហាញលើទំព័រដើម។
    type: file
    path: content/services.json
    format: json
    fields:
      - name: groups
        label: ក្រុមសេវាកម្ម
        type: object
        list: true
        fields:
          - name: id
            label: លេខកូដក្រុម (កុំប្តូរ)
            type: string
            required: true
          - name: name
            label: ឈ្មោះក្រុម
            type: string
            required: true
          - name: services
            label: សេវាកម្ម
            type: object
            list: true
            fields:
              - name: id
                label: លេខកូដ (អក្សរឡាតាំង កុំប្តូរ)
                description: "ឧ. boost-post។ សម្រាប់សេវាកម្មថ្មី ប្រើអក្សរឡាតាំងតូច និងសញ្ញា -"
                type: string
                required: true
                pattern:
                  regex: "^[a-z0-9]+(-[a-z0-9]+)*$"
                  message: ប្រើតែអក្សរឡាតាំងតូច លេខ និងសញ្ញា -
              - name: name
                label: ឈ្មោះសេវាកម្ម
                type: string
                required: true
              - name: desc
                label: ការពិពណ៌នា
                type: text
              - name: emoji
                label: Emoji លើរូបកាត
                description: "Emoji ៣ ដកឃ្លាពីគ្នា។ រូបលើកាតត្រូវបានបង្កើតដោយស្វ័យប្រវត្តិ។"
                type: string
              - name: price
                label: តម្លៃ
                description: ឧ. $79 / ខែ។ ទុកទទេ ដើម្បីបង្ហាញ «សួរតម្លៃ»។
                type: string
              - name: thumb
                label: រូបលើកាតសេវាកម្ម (ស្រេចចិត្ត)
                description: "រូបដែលបង្ហាញលើកាត។ ទំហំល្អបំផុត 1280x720 (16:9)។ ទុកទទេ ដើម្បីប្រើរូបដែលបង្កើតដោយស្វ័យប្រវត្តិ។ រូបធំៗត្រូវបានបង្រួមដោយស្វ័យប្រវត្តិ ដើម្បីឲ្យវេបសាយលឿន។"
                type: image
              - name: poster
                label: ប៉ូស្ទ័រ (បង្ហាញពេលចុច លម្អិត)
                type: image
              - name: popular
                label: ពេញនិយម
                type: boolean

  - name: promos
    label: ការផ្តល់ជូនពិសេស
    description: Pop-up ដែលលោតឡើងពេលបើកវេបសាយ។ ដាក់ប៉ូស្ទ័ររាងការ៉េ។
    type: file
    path: content/promos.json
    format: json
    list: true
    fields:
      - name: id
        label: លេខកូដ (អក្សរឡាតាំង)
        type: string
        required: true
        pattern:
          regex: "^[a-z0-9]+(-[a-z0-9]+)*$"
          message: ប្រើតែអក្សរឡាតាំងតូច លេខ និងសញ្ញា -
      - name: title
        label: ចំណងជើង
        type: string
        required: true
      - name: price
        label: តម្លៃ
        type: string
      - name: badge
        label: ស្លាក (ឧ. ថ្មី)
        type: string
      - name: points
        label: ចំណុចពិសេស
        type: string
        list: true
      - name: image
        label: ប៉ូស្ទ័រ (រាងការ៉េ)
        type: image
        required: true
      - name: popup
        label: បង្ហាញក្នុង Pop-up
        type: boolean
        default: true

  - name: listings
    label: លក់ផេក Facebook & គណនី TikTok
    description: "បិទភ្ជាប់តំណ (Link) ផេក ឬគណនី ហើយ Save។ ប្រព័ន្ធទាញយក រូប Cover រូប Profile ឈ្មោះ និងចំនួន Follower ដោយស្វ័យប្រវត្តិ ក្នុងរយៈពេលប្រហែល ២ នាទី ហើយធ្វើបច្ចុប្បន្នភាព Follower រៀងរាល់ព្រឹក។"
    type: file
    path: content/listings.json
    format: json
    fields:
      - name: groups
        label: ផ្ទាំង
        type: object
        list: true
        fields:
          - name: id
            label: លេខកូដ (កុំប្តូរ)
            type: string
            required: true
          - name: title
            label: ឈ្មោះផ្ទាំង
            type: string
            required: true
          - name: headline
            label: ចំណងជើងធំ
            type: string
          - name: price_per_1k
            label: តម្លៃក្នុង 1,000 Follower ($)
            description: ទុកទទេ ដើម្បីបង្ហាញ «សូមទាក់ទងសម្រាប់តម្លៃ»។
            type: number
          - name: items
            label: ផេក / គណនី
            type: object
            list: true
            fields:
              - name: url
                label: តំណភ្ជាប់ (Facebook Page ឬ TikTok)
                description: "ឧ. https://www.facebook.com/profile.php?id=61580134710032 ឬ https://www.tiktok.com/@username"
                type: string
                required: true
                pattern:
                  regex: "^https://(www\\.|m\\.)?(facebook\\.com|tiktok\\.com/@).+"
                  message: ត្រូវជាតំណ Facebook ឬ TikTok ដែលចាប់ផ្តើមដោយ https://
              - name: status
                label: ស្ថានភាព
                type: select
                default: available
                options:
                  values: [available, sold]
              - name: type
                label: ប្រភេទ (ស្រេចចិត្ត)
                type: select
                options:
                  values: ["", ផេកខ្មែរ, ផេកប៊ូសឡាយ, គណនី TikTok]
              - name: price
                label: តម្លៃផ្ទាល់ខ្លួន (ស្រេចចិត្ត)
                description: ឧ. $180។ ទុកទទេ ដើម្បីគណនាពី Follower។
                type: string
              - name: name
                label: ឈ្មោះ (ស្រេចចិត្ត · ជំនួសឈ្មោះស្វ័យប្រវត្តិ)
                type: string
              - name: followers
                label: Follower (ស្រេចចិត្ត · ជំនួសលេខស្វ័យប្រវត្តិ)
                type: number
              - name: picture
                label: រូប Profile (ស្រេចចិត្ត · ជំនួសរូបស្វ័យប្រវត្តិ)
                type: image
              - name: cover
                label: រូប Cover (ស្រេចចិត្ត · ជំនួសរូបស្វ័យប្រវត្តិ)
                type: image

  - name: clients
    label: អតិថិជន (Logo)
    description: "Logo អតិថិជនដែលរំកិលលើទំព័រដើម។ បន្ថែម លុប ឬអូសដើម្បីប្តូរលំដាប់។ ពាក់កណ្តាលទីមួយនៅជួរខាងលើ ពាក់កណ្តាលទីពីរនៅជួរខាងក្រោម។ រូបត្រូវបានបង្រួមដោយស្វ័យប្រវត្តិ។"
    type: file
    path: content/clients.json
    format: json
    fields:
      - name: clients
        label: Logo អតិថិជន
        type: object
        list: true
        fields:
          - name: name
            label: ឈ្មោះអតិថិជន (ស្រេចចិត្ត)
            description: សម្រាប់អ្នកប្រើកម្មវិធីអានអេក្រង់ (alt)។ មិនបង្ហាញលើរូបទេ។
            type: string
          - name: logo
            label: Logo (រាងការ៉េ)
            description: "រូបរាងការ៉េល្អបំផុត យ៉ាងតិច 256x256។ រូបមិនការ៉េនឹងត្រូវកាត់កណ្តាល។"
            type: image
            required: true

  - name: autopost-settings
    label: បោះពុម្ពស្វ័យប្រវត្តិ · ការកំណត់
    description: "បើក/បិទ ការបោះពុម្ពអត្ថបទស្វ័យប្រវត្តិ។ ពេល Save ការកំណត់ចូលជាធរមានភ្លាមៗ។ បើប្តូរម៉ោង សូមប្រាប់ Claude ឲ្យប្តូរ Scheduled task ដែរ។"
    type: file
    path: content/autopost/settings.json
    format: json
    fields:
      - name: enabled
        label: បើកការបោះពុម្ពស្វ័យប្រវត្តិ (បិទ = ផ្អាក)
        type: boolean
        default: true
      - name: mode
        label: របៀប
        description: "live = បោះពុម្ពលើវេបសាយ។ dry_run = សាកល្បង (សរសេរ និងពិនិត្យ ប៉ុន្តែមិនបង្ហាញលើវេបសាយ)។"
        type: select
        options:
          values: [live, dry_run]
      - name: timezone
        label: ម៉ោងតំបន់ (កុំប្តូរ)
        type: string
      - name: morning
        label: អត្ថបទពេលព្រឹក
        type: object
        fields:
          - name: enabled
            label: បើក
            type: boolean
          - name: time
            label: ម៉ោង (HH:MM ម៉ោងកម្ពុជា)
            type: string
            pattern:
              regex: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
              message: ឧ. 07:00
      - name: evening
        label: អត្ថបទពេលល្ងាច
        type: object
        fields:
          - name: enabled
            label: បើក
            type: boolean
          - name: time
            label: ម៉ោង (HH:MM ម៉ោងកម្ពុជា)
            type: string
            pattern:
              regex: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
              message: ឧ. 17:00
      - name: early_minutes
        label: អាចចាប់ផ្តើមមុនម៉ោង (នាទី)
        type: number
      - name: late_minutes
