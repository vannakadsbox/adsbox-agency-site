# Admin panel settings for Pages CMS (https://app.pagescms.org).
# Staff edit the files in content/; .github/workflows/build.yml then rebuilds the site.
# Sidebar: 3 groups (sell & prices, homepage, knowledge). Technical fields are hidden; long lists collapse to one line each.
media:
  input: assets/uploads
  output: /assets/uploads
  extensions:
  - jpg
  - jpeg
  - png
  - webp
  - gif
content:
- name: grp-sell
  label: លក់ និងតម្លៃ
  type: group
  items:
  - name: services
    label: សេវាកម្ម និងតម្លៃ
    description: សេវាកម្មទាំងអស់ដែលបង្ហាញលើទំព័រដើម។
    type: file
    path: content/services.json
    format: json
    fields:
    - name: groups
      label: ក្រុមសេវាកម្ម
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{name}'
      fields:
      - name: id
        label: លេខកូដក្រុម (កុំប្តូរ)
        type: string
        required: true
        readonly: true
      - name: name
        label: ឈ្មោះក្រុម
        type: string
        required: true
      - name: services
        label: សេវាកម្ម
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{name} · {price}'
        fields:
        - name: id
          label: លេខកូដ (អក្សរឡាតាំង កុំប្តូរ)
          description: ឧ. boost-post។ សម្រាប់សេវាកម្មថ្មី ប្រើអក្សរឡាតាំងតូច និងសញ្ញា -
          type: string
          required: true
          pattern:
            regex: ^[a-z0-9]+(-[a-z0-9]+)*$
            message: ប្រើតែអក្សរឡាតាំងតូច លេខ និងសញ្ញា -
        - name: name
          label: ឈ្មោះសេវាកម្ម
          type: string
          required: true
        - name: desc
          label: ការពិពណ៌នា
          type: text
        - name: emoji
          label: Emoji លើរូបកាត
          description: Emoji ៣ ដកឃ្លាពីគ្នា។ រូបលើកាតត្រូវបានបង្កើតដោយស្វ័យប្រវត្តិ។
          type: string
        - name: price
          label: តម្លៃ
          description: ឧ. $79 / ខែ។ ទុកទទេ ដើម្បីបង្ហាញ «សួរតម្លៃ»។
          type: string
        - name: thumb
          label: រូបលើកាតសេវាកម្ម (ស្រេចចិត្ត)
          description: រូបដែលបង្ហាញលើកាត។ ទំហំល្អបំផុត 1280x720 (16:9)។ ទុកទទេ ដើម្បីប្រើរូបដែលបង្កើតដោយស្វ័យប្រវត្តិ។ រូបធំៗត្រូវបានបង្រួមដោយស្វ័យប្រវត្តិ ដើម្បីឲ្យវេបសាយលឿន។
          type: image
        - name: poster
          label: ប៉ូស្ទ័រ (បង្ហាញពេលចុច លម្អិត)
          type: image
        - name: popular
          label: ពេញនិយម
          type: boolean
  - name: accounts-for-sale
    label: លក់ផេក & អាខោន TikTok
    description: ដាក់តែតំណភ្ជាប់ ហើយ Save។ ឈ្មោះ ចំនួន Follower និងរូប Profile ត្រូវបានយកដោយស្វ័យប្រវត្តិ។ Facebook មិនផ្តល់រូប Cover ជាសាធារណៈទេ ដូច្នេះអាចដាក់រូប Cover ផ្ទាល់ខ្លួន ឬទុកឲ្យប្រព័ន្ធបង្កើតពីរូប
      Profile។
    type: file
    path: content/accounts.json
    format: json
    fields:
    - name: facebook
      label: លក់ផេក Facebook
      type: object
      fields:
      - name: title
        label: ឈ្មោះផ្ទាំង
        type: string
      - name: price_per_1k
        label: តម្លៃក្នុង 1,000 Follower ($)
        description: ឧ. 15។ ដាក់ 0 ដើម្បីបង្ហាញ «សូមទាក់ទងសម្រាប់តម្លៃ»។
        type: number
      - name: items
        label: ផេក
        type: object
        list:
          collapsible:
            collapsed: true
            summary: ផេក {index} · {status} · {url}
        fields:
        - name: url
          label: តំណភ្ជាប់ (Link)
          description: ឧ. https://www.facebook.com/profile.php?id=61580134710032 ។ ឈ្មោះ ចំនួន Follower និងរូប Profile ត្រូវបានយកដោយស្វ័យប្រវត្តិ (ក្រោយ Save ប្រហែល 2 នាទី និងធ្វើបច្ចុប្បន្នភាពរៀងរាល់ថ្ងៃ)។
          type: string
          required: true
          pattern:
            regex: ^https://(www\.|m\.)?facebook\.com/.+
            message: ត្រូវចាប់ផ្តើមដោយ https://www.facebook.com/
        - name: type
          label: ប្រភេទ
          type: select
          default: ផេកខ្មែរ
          options:
            values:
            - ផេកខ្មែរ
            - ផេកប៊ូសឡាយ
        - name: status
          label: ស្ថានភាព
          type: select
          default: available
          options:
            values:
            - available
            - sold
        - name: cover
          label: រូប Cover (ស្រេចចិត្ត)
          description: 16:9 ឧ. 1280x720។ ទុកទទេ ប្រព័ន្ធបង្កើត Cover ពីរូប Profile ដោយស្វ័យប្រវត្តិ។
          type: image
        - name: name
          label: ឈ្មោះ (ស្រេចចិត្ត)
          description: ទុកទទេ ដើម្បីប្រើឈ្មោះដែលយកដោយស្វ័យប្រវត្តិ។ បំពេញតែពេលចង់ប្តូរ។
          type: string
        - name: followers
          label: ចំនួន Follower (ស្រេចចិត្ត)
          description: ទុកទទេ ដើម្បីប្រើចំនួនដែលយកដោយស្វ័យប្រវត្តិ។
          type: string
        - name: discount
          label: បញ្ចុះតម្លៃ (%)
          description: ឧ. 20 = បញ្ចុះ 20%។ ទុក 0 ឬទទេ = គ្មានបញ្ចុះ។
          type: number
    - name: tiktok
      label: លក់អាខោន TikTok
      type: object
      fields:
      - name: title
        label: ឈ្មោះផ្ទាំង
        type: string
      - name: price_per_1k
        label: តម្លៃក្នុង 1,000 Follower ($)
        description: ដាក់ 0 ដើម្បីបង្ហាញ «សូមទាក់ទងសម្រាប់តម្លៃ»។
        type: number
      - name: items
        label: អាខោន TikTok
        type: object
        list:
          collapsible:
            collapsed: true
            summary: អាខោន {index} · {status} · {url}
        fields:
        - name: url
          label: តំណភ្ជាប់ (Link)
          description: ឧ. https://www.tiktok.com/@username ។ ឈ្មោះ ចំនួន Follower និងរូប Profile ត្រូវបានយកដោយស្វ័យប្រវត្តិ (ក្រោយ Save ប្រហែល 2 នាទី និងធ្វើបច្ចុប្បន្នភាពរៀងរាល់ថ្ងៃ)។
          type: string
          required: true
          pattern:
            regex: ^https://(www\.)?tiktok\.com/@.+
            message: ត្រូវចាប់ផ្តើមដោយ https://www.tiktok.com/@
        - name: status
          label: ស្ថានភាព
          type: select
          default: available
          options:
            values:
            - available
            - sold
        - name: cover
          label: រូប Cover (ស្រេចចិត្ត)
          description: 16:9 ឧ. 1280x720។ ទុកទទេ ប្រព័ន្ធបង្កើត Cover ពីរូប Profile ដោយស្វ័យប្រវត្តិ។
          type: image
        - name: name
          label: ឈ្មោះ (ស្រេចចិត្ត)
          description: ទុកទទេ ដើម្បីប្រើឈ្មោះដែលយកដោយស្វ័យប្រវត្តិ។ បំពេញតែពេលចង់ប្តូរ។
          type: string
        - name: followers
          label: ចំនួន Follower (ស្រេចចិត្ត)
          description: ទុកទទេ ដើម្បីប្រើចំនួនដែលយកដោយស្វ័យប្រវត្តិ។
          type: string
  - name: promos
    label: ការផ្តល់ជូនពិសេស (Pop-up)
    description: Pop-up ដែលលោតឡើងពេលបើកវេបសាយ។ ដាក់ប៉ូស្ទ័ររាងការ៉េ។
    type: file
    path: content/promos.json
    format: json
    list: true
    fields:
    - name: id
      label: លេខកូដ (អក្សរឡាតាំង)
      type: string
      required: true
      pattern:
        regex: ^[a-z0-9]+(-[a-z0-9]+)*$
        message: ប្រើតែអក្សរឡាតាំងតូច លេខ និងសញ្ញា -
    - name: title
      label: ចំណងជើង
      type: string
      required: true
    - name: price
      label: តម្លៃ
      type: string
    - name: badge
      label: ស្លាក (ឧ. ថ្មី)
      type: string
    - name: points
      label: ចំណុចពិសេស
      type: string
      list: true
    - name: image
      label: ប៉ូស្ទ័រ (រាងការ៉េ)
      type: image
      required: true
    - name: popup
      label: បង្ហាញក្នុង Pop-up
      type: boolean
      default: true
- name: grp-site
  label: ទំព័រដើម
  type: group
  items:
  - name: clients
    label: ផេកអតិថិជន
    description: ផេក Facebook របស់អតិថិជនដែលរំកិលលើទំព័រដើម។ ដាក់តែ Link និងប្រភេទ — ឈ្មោះ ចំនួន Follower និងរូប Profile យកដោយស្វ័យប្រវត្តិ។
    type: file
    path: content/clients.json
    format: json
    fields:
    - name: clients
      label: ផេកអតិថិជន
      type: object
      list:
        collapsible:
          collapsed: true
          summary: ផេក {index} · {category} · {url}
      fields:
      - name: url
        label: តំណភ្ជាប់ផេក (Link)
        type: string
        required: true
        pattern:
          regex: ^https://(www\.|m\.|web\.)?facebook\.com/.+
          message: ត្រូវចាប់ផ្តើមដោយ https://web.facebook.com/ ឬ https://www.facebook.com/
      - name: category
        label: ប្រភេទ
        type: string
      - name: name
        label: ឈ្មោះ (ស្រេចចិត្ត)
        description: ទុកទទេ ដើម្បីប្រើឈ្មោះដែលយកដោយស្វ័យប្រវត្តិ។
        type: string
      - name: followers
        label: ចំនួន Follower (ស្រេចចិត្ត)
        description: ទុកទទេ ដើម្បីប្រើចំនួនដែលយកដោយស្វ័យប្រវត្តិ។
        type: string
- name: grp-knowledge
  label: ចំណេះដឹង
  type: group
  items:
  - name: articles
    label: អត្ថបទចំណេះដឹង
    description: អត្ថបទក្នុងទំព័រ ចំណេះដឹង។ ចុច «Add an entry» ដើម្បីសរសេរថ្មី។ បិទ «ព្រាង / ដកចេញ» ដើម្បីបង្ហាញលើវេបសាយ។
    type: collection
    path: content/articles
    format: yaml-frontmatter
    filename:
      template: '{fields.slug}.md'
      field: create
    view:
      fields:
      - title
      - tag
      - date
      - draft
      primary: title
      sort:
      - date
      - title
      default:
        sort: date
        order: desc
      search:
      - title
      - summary
      - tag
    fields:
    - name: title
      label: ចំណងជើង
      type: string
      required: true
    - name: summary
      label: សេចក្តីសង្ខេប
      description: ១-២ ប្រយោគ។ បង្ហាញលើកាត និងពេលចែករំលែកលើ Facebook។
      type: text
      required: true
    - name: tag
      label: ប្រធានបទ
      type: select
      required: true
      default: Boost Post
      options:
        values:
        - Boost Post
        - Boost Live
        - TikTok
        - លក់ Live
        - ថែទាំផេក
        - រចនា
        - Messenger
        - ចំណេះដឹង
        - លក់អនឡាញ
        - សេវាអតិថិជន
        - ថវិកា និងរបាយការណ៍
        - ADS BOX
    - name: date
      label: កាលបរិច្ឆេទ
      type: date
      required: true
    - name: body
      label: អត្ថបទ
      type: rich-text
      options:
        format: markdown
    - name: draft
      label: ព្រាង / ដកចេញពីវេបសាយ
      description: បើកវា ដើម្បីលាក់អត្ថបទពីវេបសាយ (មិនលុបចោល)។ បិទវិញ ដើម្បីបង្ហាញម្តងទៀត។
      type: boolean
      default: false
    - name: cover
      label: រូបគម្របផ្ទាល់ខ្លួន (ស្រេចចិត្ត)
      description: ទុកទទេ ដើម្បីប្រើរូបគម្របស្វ័យប្រវត្តិ។ បើដាក់ សូមប្រើរូបទំហំ 1200x630។
      type: image
    - name: emoji
      label: Emoji លើរូបគម្រប
      description: Emoji ៣ ដកឃ្លាពីគ្នា ឧ. 🎥 🛍️ 💡។ រូបគម្រប និងរូបចែករំលែក Facebook ត្រូវបានបង្កើតដោយស្វ័យប្រវត្តិ។
      type: string
      default: 📣 💬 📈
    - name: slug
      label: តំណភ្ជាប់ (អក្សរឡាតាំង)
      description: ជាអក្សរអង់គ្លេសតូច និងសញ្ញា - ប៉ុណ្ណោះ ឧ. boost-tips-for-new-page។ វាក្លាយជា adsbox.agency/knowledge/<តំណ>/ ហើយមិនអាចប្តូរបានក្រោយពេលបង្កើត។
      type: string
      required: true
      pattern:
        regex: ^[a-z0-9]+(-[a-z0-9]+)*$
        message: ប្រើតែអក្សរឡាតាំងតូច លេខ និងសញ្ញា - (ឧ. sell-more-on-live)
    - name: seo_title
      label: SEO ចំណងជើង (ស្រេចចិត្ត)
