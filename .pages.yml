          collapsed: true
          summary: '{date} · {slot} · {status} · {title}'
      fields:
      - name: date
        label: ថ្ងៃ
        type: string
      - name: slot
        label: ពេល
        type: string
      - name: status
        label: ស្ថានភាព
        type: string
      - name: title
        label: ចំណងជើង
        type: string
      - name: url
        label: តំណភ្ជាប់
        type: string
      - name: published_at
        label: ពេលបោះពុម្ព
        type: string
      - name: error
        label: កំហុស
        type: text
      - name: attempts
        label: ចំនួនដង
        type: number
      - name: category
        label: ប្រភេទ
        type: string
      - name: angle
        label: មុំ
        type: string
      - name: slug
        label: slug
        type: string
      - name: summary
        label: សង្ខេប
        type: text
      - name: primary_keyword
        label: ពាក្យគន្លឹះ
        type: string
      - name: tag
        label: ស្លាក
        type: string
      - name: khmer_chars
        label: ប្រវែង
        type: number
      - name: file
        label: ឯកសារសាកល្បង
        type: string
      - name: generated_at
        label: ពេលបង្កើត
        type: string
      - name: failed_at
        label: ពេលបរាជ័យ
        type: string
